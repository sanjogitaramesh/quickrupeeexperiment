<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking first paint; text shows in the system font until it arrives (display=swap). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#1E2B2F; --muted:#4F5F64; --paper:#F3F6F5; --sheet:#FFFFFF;
  --line:#DCE3E1; --control:#74858A; --accent:#1D5C63; --accent-soft:#E2EEEE;
  --error:#B42318; --error-soft:#FDF1EF;
  /* Latin glyphs use system fonts (no swap, no layout shift); Devanagari glyphs fall through to Noto. */
  /* Named fonts only: system-ui/-apple-system would use the OS Devanagari fallback and never reach Noto. */
  --font:'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans Devanagari','Nirmala UI','Kohinoor Devanagari','Mangal',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);min-height:100vh;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* Top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;max-width:680px;margin:0 auto;padding:12px 16px}
.brand{font-size:14px;font-weight:600;color:var(--muted)}
.lang{display:flex;border:1.5px solid var(--control);border-radius:10px;overflow:hidden;background:var(--sheet)}
.lang button{min-height:44px;min-width:56px;padding:0 14px;border:0;background:transparent;font-size:15px;line-height:1.3;cursor:pointer}
.lang button+button{border-left:1px solid var(--control)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}

/* Progress */
.progress{max-width:680px;margin:0 auto;padding:0 16px 8px}
.progress-text{font-size:14px;color:var(--muted);margin-bottom:6px}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .3s}

main{max-width:680px;margin:0 auto;padding:8px 16px 48px}
.screen{display:none}.screen.active{display:block}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px}
h1{font-size:26px;line-height:1.35;font-weight:600;margin-bottom:12px}
h2{font-size:20px;line-height:1.4;font-weight:600;margin-bottom:10px}
h1:focus,h2:focus{outline:none}
.lede,.sheet p{color:var(--muted)}
.sheet p+p{margin-top:10px}
.req-note{font-size:14px;margin-top:14px}
.req{color:var(--error);margin-left:3px}
.strong{color:var(--ink)!important;font-weight:600}
.checklist{margin:8px 0 4px 1.2em;color:var(--ink)}
.checklist li{padding:2px 0}

/* Questions */
.q{border:0;padding:20px 0;border-top:1px solid var(--line);min-width:0}
.sheet>.q:first-child{border-top:0;padding-top:0}
.q:last-child{padding-bottom:0}
.q-label{float:left;width:100%;font-size:17px;font-weight:600;line-height:1.5;margin-bottom:12px;padding:0}
.q-label+*{clear:both}
.options{display:flex;flex-direction:column;gap:4px}
.option{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 10px;border-radius:10px;cursor:pointer;line-height:1.45}
.option:hover{background:var(--paper)}
.option:has(input:checked){background:var(--accent-soft)}
.option input{width:20px;height:20px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
.option input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.other-field{display:block;width:100%;min-height:44px;margin:4px 0 0;padding:8px 12px;border:1.5px solid var(--control);border-radius:10px;background:var(--sheet)}
.other-field:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

/* Likert: one horizontal ruler, identical at every width. 1 = strongly disagree on the left. */
.scale{display:grid;grid-template-columns:repeat(5,minmax(44px,1fr));max-width:420px;border:1.5px solid var(--control);border-radius:12px;overflow:hidden;background:var(--sheet)}
.pt{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;cursor:pointer}
.pt+.pt{border-left:1px solid var(--control)}
.pt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pt-n{font-size:18px;font-weight:600;line-height:1;pointer-events:none}
.pt:hover{background:var(--paper)}
.pt:has(input:checked){background:var(--accent);color:#fff}
.pt:has(input:focus-visible){outline:3px solid var(--ink);outline-offset:-5px}
.anchors{display:flex;justify-content:space-between;gap:12px;max-width:420px;margin-top:8px;font-size:14px;line-height:1.45;color:var(--muted)}
.anchors span{max-width:48%}
.anchors span+span{text-align:right}

/* Errors */
.error-msg{margin-top:8px;font-size:15px;font-weight:600;color:var(--error)}
.q.error{background:var(--error-soft);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:10px}

/* Actions */
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.btn{min-height:48px;padding:10px 24px;border-radius:10px;font-size:16px;font-weight:600;line-height:1.3;cursor:pointer;border:1.5px solid transparent}
.btn.primary{background:var(--accent);color:#fff;margin-left:auto}
.btn.primary:hover{background:#174C52}
.btn.ghost{background:transparent;border-color:var(--control)}
.btn:focus-visible,.lang button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* Loan interface */
.frame-wrap iframe{display:block;width:100%;max-width:460px;height:900px;margin:0 auto;border:0}

/* Status screens */
.status{text-align:center;padding:56px 8px}
.status h1,.status h2{margin-bottom:10px}
.status p{color:var(--muted)}
.spin{width:40px;height:40px;margin:0 auto 16px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.fill{transition:none}}

@media (max-width:480px){
  .sheet{padding:20px 16px;border-radius:12px}
  h1{font-size:22px}
  .q-label{font-size:16px}
  .q.error{margin:0 -8px;padding-left:8px;padding-right:8px}
  .btn{padding:10px 18px}
  .frame-wrap{margin:0 -16px}
}
</style>

<script>
(function () {
'use strict';

// ============================================================
// Replace with your deployed Google Apps Script Web App URL
// >>> SHEET_URL — the ONLY place the Apps Script web app URL is set (the loan screens have none).
// >>> To go live, swap it for the scholar's deployment URL. See SWITCHING.md.
var SHEET_URL = "https://script.google.com/macros/s/AKfycbyOLrjNSs7QPSni0tfqzfSDTJaT1VGPJ6OGbaPAQDbgHSIpZP2-7-W11toAtVdiiO2Z/exec";
var DEMO_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";
// ============================================================

var translations = JSON.parse(document.getElementById('i18n').textContent);
var LANGS = ['en', 'hi', 'mr'];
var lang = 'en';
try { var saved = sessionStorage.getItem('qr_lang'); if (LANGS.indexOf(saved) > -1) lang = saved; } catch (e) {}

function t(key, vars) {
  var s = translations[lang][key];
  if (s == null) s = translations.en[key];
  if (s == null) { console.warn('Missing translation key:', key); s = key; }
  if (vars) s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
  return s;
}
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// ---- Instrument definition. Option values are the stored codes (unchanged from the original
// survey so the Sheet stays consistent); the visible text comes from `translations`. ----
var YN = ['Yes', 'No', 'Maybe, but I am not certain', 'Not sure what this means'];
var Q = {
  consent: { opts: ['yes', 'no'], err: 'err.consent' },
  q2: { opts: ['18–24 years', '25–30 years', '31–35 years', '36–40 years', '41–45 years', '45 and above'] },
  q3: { opts: ['Higher Secondary (12th standard)', 'Undergraduate (BE/B.com/B.Sc/BBA/BA etc)', 'Post Graduate (MBA/MA/M.Sc etc)', 'Doctoral (PhD)'], other: true },
  q4: { opts: ['Salaried-private sector', 'Salaried-government sector', 'Self employed/Business Owner', 'Student', 'Freelancer', 'Unemployed'], other: true },
  q5: { opts: ['Below Rs 15000', 'Rs 15000–30000', 'Rs 30001–50000', 'Rs 50001–100000', 'Above Rs 100000', 'Prefer not to say'] },
  q6: { opts: ['Yes, I have applied successfully and taken the loan', 'Yes, I have applied but not complete the process', 'No, but I have browsed such applications', 'No, I have never used such digital lending apps'] },
  q7: { opts: ['1–2', '3–5', 'More than 5', 'None'] },
  q8: { opts: ['₹1,00,020', '₹1,02,000', '₹1,20,000', '₹1,00,200', "I don't know"] },
  q9: { opts: ['More than today', 'Exactly the same', 'Less than today', 'Impossible to tell', "I don't know"] },
  q10: { opts: ['More than ₹1,50,000', 'Exactly ₹1,50,000', 'Less than ₹1,50,000', "I don't know"] },
  q11: { opts: ['Buying shares in one company is less risky than a mutual fund', 'A mutual fund is less risky than buying shares in one company', 'Both carry the same risk', "I don't know"] },
  q12: { opts: ['₹6,000', '₹4,500', '₹5,000', '₹7,200', "I don't know"] },
  x1: { opts: YN, textKey: 'yn' },
  x2: { opts: YN, textKey: 'yn' },
  x3: { opts: ['Yes, a higher amount was already selected', 'Yes, but I am not sure if it was higher or just a default', 'No, I had to choose the amount myself', 'I do not remember'] },
  x4: { opts: ['Very easy — it was clearly displayed', 'Somewhat easy', 'Neutral', 'Somewhat difficult — I had to look for it', 'Very difficult — the information was hard to find'] }
};
var LIKERT = ['1', '2', '3', '4', '5']; // left to right, 1 = strongly disagree, on every screen size
var FL_CORRECT = { q8: '₹1,02,000', q9: 'Less than today', q10: 'More than ₹1,50,000', q11: 'A mutual fund is less risky than buying shares in one company', q12: '₹5,000' };
var TOTAL_STEPS = 6;

// ---- Markup builders (text is filled in by applyI18n) ----
function T(key, tag, cls, extra) {
  tag = tag || 'span';
  return '<' + tag + (cls ? ' class="' + cls + '"' : '') + (extra || '') + ' data-i18n="' + key + '"></' + tag + '>';
}
var REQ = '<span class="req" aria-hidden="true">*</span><span class="sr-only" data-i18n="a11y.required"></span>';
function errEl(id) { return '<p class="error-msg" id="err-' + id + '" hidden></p>'; }

function choiceQ(id) {
  var q = Q[id], tk = q.textKey || id;
  var h = '<fieldset class="q" id="card-' + id + '"><legend class="q-label">' + T(id + '.label') + REQ + '</legend><div class="options">';
  q.opts.forEach(function (v, i) {
    h += '<label class="option"><input type="radio" name="' + id + '" value="' + esc(v) + '">' + T(tk + '.o' + i) + '</label>';
  });
  if (q.other) {
    h += '<label class="option"><input type="radio" name="' + id + '" value="other">' + T('opt.other') + '</label>' +
         '<input type="text" class="other-field" id="' + id + '-other" maxlength="200" data-i18n-ph="opt.otherPh" data-i18n-aria="opt.otherPh" hidden>';
  }
  return h + '</div>' + errEl(id) + '</fieldset>';
}
function likertQ(id) {
  var h = '<fieldset class="q likert" id="card-' + id + '"><legend class="q-label">' + T(id + '.label') + REQ + '</legend><div class="scale" dir="ltr">';
  LIKERT.forEach(function (v) {
    h += '<label class="pt"><input type="radio" name="' + id + '" value="' + v + '"><span class="pt-n">' + v + '</span> ' + T('likert.' + v, 'span', 'sr-only') + '</label>';
  });
  return h + '</div><div class="anchors" dir="ltr" aria-hidden="true">' + T('likert.1') + T('likert.5') + '</div>' + errEl(id) + '</fieldset>';
}
function actions(back, nextAct, nextKey) {
  return '<div class="actions">' + (back ? '<button type="button" class="btn ghost" data-go="' + back + '" data-i18n="btn.back"></button>' : '') +
         '<button type="button" class="btn primary" data-act="' + nextAct + '" data-i18n="' + nextKey + '"></button></div>';
}
function screen(id, step, inner) {
  return '<section class="screen" id="screen-' + id + '" data-step="' + step + '">' + inner + '</section>';
}
function statusScreen(id, titleKey, bodyHtml, spin) {
  return screen(id, 0, '<div class="status">' + (spin ? '<div class="spin" aria-hidden="true"></div>' : '') +
    (titleKey ? T(titleKey, 'h1', '', ' tabindex="-1"') : '') + bodyHtml + '</div>');
}
function section(titleKey, descHtml, body) {
  return '<div class="sheet">' + T(titleKey, 'h1', '', ' tabindex="-1"') + descHtml + '</div><div class="sheet">' + body + '</div>';
}

var DEMO_IDS = ['q2', 'q3', 'q4', 'q5', 'q6', 'q7'];
var FL_IDS = ['q8', 'q9', 'q10', 'q11', 'q12'];
var PP_IDS = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6'];
var DC_IDS = ['d1', 'd2', 'd3', 'd4', 'd5'];
var DP_IDS = ['x1', 'x2', 'x3', 'x4'];

$('app').innerHTML =
  screen('consent', 0,
    '<div class="sheet">' + T('consent.title', 'h1', '', ' tabindex="-1"') + T('consent.intro', 'p', 'lede') + T('req.note', 'p', 'req-note') + '</div>' +
    '<div class="sheet">' + choiceQ('consent') + '</div>' +
    '<div class="sheet">' + T('brief.title', 'h2') + T('brief.p1', 'p') + T('brief.important', 'p', 'strong') +
      '<ul class="checklist">' + T('brief.li1', 'li') + T('brief.li2', 'li') + T('brief.li3', 'li') + '</ul>' + T('brief.p2', 'p') + '</div>' +
    actions(null, 'consent', 'btn.begin')) +
  screen('demographics', 1,
    section('demo.title', T('demo.intro', 'p'), DEMO_IDS.map(choiceQ).join('')) + actions(null, 'toLoan', 'btn.toLoan')) +
  statusScreen('loading', null, T('loading', 'p') + '<p id="loadingSlow" style="margin-top:12px" data-i18n="loading.slow" hidden></p>' +
    '<div class="actions" style="justify-content:center;margin-top:20px"><button type="button" class="btn primary" id="retryFrame" style="margin:0" data-act="retryFrame" data-i18n="btn.retry" hidden></button></div>', true) +
  screen('interface', 2, '<div class="frame-wrap"><iframe id="loanFrame" data-i18n-title="frame.title"></iframe></div>') +
  screen('financial', 3, section('fl.title', T('fl.desc', 'p'), FL_IDS.map(choiceQ).join('')) + actions(null, 'toPressure', 'btn.next')) +
  screen('pressure', 4, section('pp.title', T('pp.desc', 'p'), PP_IDS.map(likertQ).join('')) + actions('financial', 'toConfidence', 'btn.next')) +
  screen('confidence', 5, section('dc.title', T('dc.desc', 'p'),
    DC_IDS.map(likertQ).join('')) + actions('pressure', 'toDetection', 'btn.next')) +
  screen('detection', 6, section('dp.title', T('dp.desc', 'p'), DP_IDS.map(choiceQ).join('')) + actions('confidence', 'submit', 'btn.submit')) +
  statusScreen('submitting', null, T('submitting', 'p'), true) +
  statusScreen('thankyou', 'ty.title', T('ty.body', 'p') + '<p><br><strong data-i18n="ty.name"></strong><br><span data-i18n="ty.inst"></span></p>') +
  statusScreen('failed', 'fail.title', T('fail.body', 'p') + '<div class="actions" style="justify-content:center;margin-top:20px"><button type="button" class="btn primary" style="margin:0" data-act="retry" data-i18n="btn.retry"></button></div>') +
  statusScreen('declined', 'declined.title', T('declined.body', 'p'));

$('langNav').innerHTML = LANGS.map(function (l) {
  return '<button type="button" lang="' + l + '" data-lang="' + l + '">' + esc(translations[l]['lang.name']) + '</button>';
}).join('');

// ---- i18n ----
function applyI18n() {
  document.documentElement.lang = lang;
  document.title = t('meta.title');
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
  document.querySelectorAll('[data-i18n-title]').forEach(function (el) { el.title = t(el.getAttribute('data-i18n-title')); });
  document.querySelectorAll('.error-msg[data-key]').forEach(function (el) { el.textContent = t(el.getAttribute('data-key')); });
  $('langNav').setAttribute('aria-label', t('lang.label'));
  document.querySelectorAll('#langNav button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  updateProgress();
}
function setLang(l) {
  if (LANGS.indexOf(l) < 0 || l === lang) return;
  lang = l;
  try { sessionStorage.setItem('qr_lang', l); } catch (e) {}
  applyI18n();
  postLangToFrame();
}
function postLangToFrame() {
  var f = $('loanFrame');
  if (f && f.contentWindow && f.getAttribute('src')) f.contentWindow.postMessage({ type: 'quickrupee-lang', lang: lang }, '*');
}

// ---- Screens & progress ----
var current = 'consent';
function updateProgress() {
  var step = Number($('screen-' + current).getAttribute('data-step'));
  $('progress').hidden = !step;
  if (!step) return;
  $('progressText').textContent = t('progress', { n: step, total: TOTAL_STEPS, name: t('step.' + step) });
  $('progressFill').style.transform = 'scaleX(' + (step / TOTAL_STEPS) + ')';
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  var el = $('screen-' + id);
  el.classList.add('active');
  current = id;
  updateProgress();
  window.scrollTo(0, 0);
  var h = el.querySelector('h1');
  if (h) h.focus({ preventScroll: true });
}

// ---- Answers ----
function checked(name) { return document.querySelector('input[name="' + name + '"]:checked'); }
function getAnswer(name) {
  var sel = checked(name);
  if (!sel) return '';
  if (sel.value === 'other') {
    var f = $(name + '-other');
    return f && f.value.trim() ? 'Other: ' + f.value.trim() : 'Other';
  }
  return sel.value;
}
function setError(id, key) {
  var card = $('card-' + id), m = $('err-' + id);
  card.classList.toggle('error', !!key);
  if (key) {
    m.setAttribute('data-key', key); m.textContent = t(key); m.hidden = false;
    card.setAttribute('aria-describedby', 'err-' + id);
  } else {
    m.removeAttribute('data-key'); m.hidden = true;
    card.removeAttribute('aria-describedby');
  }
}
function errorFor(id) {
  var sel = checked(id);
  if (!sel) return Q[id] && Q[id].err ? Q[id].err : 'err.required';
  if (sel.value === 'other' && !$(id + '-other').value.trim()) return 'err.other';
  return null;
}
function validate(ids) {
  var first = null;
  ids.forEach(function (id) {
    var key = errorFor(id);
    setError(id, key);
    if (key && !first) first = { id: id, key: key };
  });
  if (!first) return true;
  var card = $('card-' + first.id);
  card.scrollIntoView({ block: 'center' });
  var target = first.key === 'err.other' ? $(first.id + '-other') : card.querySelector('input');
  target.focus({ preventScroll: true });
  return false;
}

document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.type !== 'radio') return;
  var id = el.name, other = $(id + '-other');
  if (other) {
    var on = el.value === 'other';
    other.hidden = !on; other.disabled = !on;
    if (on) other.focus(); else other.value = '';
  }
  if ($('card-' + id).classList.contains('error') && !errorFor(id)) setError(id, null);
});
document.addEventListener('input', function (e) {
  var m = /^(q\d+)-other$/.exec(e.target.id || '');
  if (m && $('card-' + m[1]).classList.contains('error') && !errorFor(m[1])) setError(m[1], null);
});

// ---- Condition assignment & loan interface ----
var assignedCondition = null, participantNumber = null;
var participantId = 'P_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
var loanData = null, interfaceStartTime = 0, interfaceDuration = 0, iframeLoaded = false;
var assignBusy = false, frameReady = false, wantInterface = false, slowTimer = null;
var ASSIGN_DELAYS = [0, 1000, 2000, 4000, 8000]; // 5 attempts, then wait for the participant's retry

// Only an OK, parseable JSON reply counts; HTML error pages and HTTP errors are failures.
function readJson(r) {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text().then(function (txt) {
    try { return JSON.parse(txt); } catch (e) { throw new Error('Not JSON: ' + txt.slice(0, 80)); }
  });
}

// The assign call is slow (Apps Script: ~1.5 s even for a no-op), so it starts as soon as consent is given
// and runs while the participant answers "About you". The server keys the assignment on participantId,
// so retrying with the same id can never give this participant a second, different group.
// There is no random fallback: the participant waits (with a retry button) until the server answers.
function requestCondition() {
  if (assignedCondition || assignBusy) return;
  assignBusy = true;
  if (SHEET_URL === DEMO_URL) {
    assignedCondition = Date.now() % 2 === 0 ? 'Control' : 'Treatment';
    participantNumber = 0;
    assignBusy = false;
    loadIframe();
    return;
  }
  var attempt = 0;
  (function tryOnce() {
    fetch(SHEET_URL + '?action=assign&pid=' + encodeURIComponent(participantId))
      .then(readJson)
      .then(function (data) {
        if (data.status !== 'success' || (data.condition !== 'Control' && data.condition !== 'Treatment')) {
          throw new Error(data.message || 'Unexpected reply');
        }
        assignedCondition = data.condition;
        participantNumber = data.participantNumber;
        assignBusy = false;
        loadIframe();
      })
      .catch(function (err) {
        console.warn('Assignment attempt ' + (attempt + 1) + ' failed:', err.message);
        attempt++;
        if (attempt < ASSIGN_DELAYS.length) setTimeout(tryOnce, ASSIGN_DELAYS[attempt]);
        else assignBusy = false; // stop here; the retry button starts a new cycle with the same id
      });
  })();
}
// Consent given: get the condition and preload the matching loan screen while it is still hidden.
function prepareInterface() { requestCondition(); }

function startInterface() {
  if (!validate(DEMO_IDS)) return;
  wantInterface = true;
  requestCondition(); // no-op while a request is running or once assigned
  if (frameReady) { revealInterface(); return; }
  showScreen('loading');
  armSlowTimer();
}
// Still not ready 12 s after Continue: show a message and a retry button (reloads the same condition).
function armSlowTimer() {
  clearTimeout(slowTimer);
  $('loadingSlow').hidden = true; $('retryFrame').hidden = true;
  slowTimer = setTimeout(function () {
    if (frameReady) return;
    $('loadingSlow').hidden = false; $('retryFrame').hidden = false;
  }, 12000);
}
function retryFrame() {
  if (!assignedCondition) { requestCondition(); armSlowTimer(); return; } // ask again, same participantId
  frameReady = false;
  var frame = $('loanFrame');
  frame.src = frame.getAttribute('src');
  armSlowTimer();
}
function loadIframe() {
  if (iframeLoaded) return;
  iframeLoaded = true;
  var page = assignedCondition === 'Treatment' ? 'quickrupee_treatment.html' : 'quickrupee_control.html';
  var frame = $('loanFrame');
  frame.onload = postLangToFrame;
  frame.src = page + '?embedded=true&lang=' + lang;
}
function revealInterface() {
  clearTimeout(slowTimer);
  interfaceStartTime = Date.now();
  showScreen('interface');
  // The treatment countdown starts now, so a preloaded screen still opens at 09:47.
  $('loanFrame').contentWindow.postMessage({ type: 'quickrupee-show' }, '*');
}

window.addEventListener('message', function (event) {
  var frame = $('loanFrame');
  if (!frame || event.source !== frame.contentWindow) return; // only trust our own loan iframe
  var d = event.data;
  if (!d || !d.type) return;
  if (d.type === 'quickrupee-resize' && !frameReady) {
    frameReady = true; // first message from the loan page = it has loaded and is running
    if (wantInterface && current === 'loading') revealInterface();
  }
  if (d.type === 'quickrupee-resize' && d.height > 0 && current === 'interface') frame.style.height = Math.ceil(d.height) + 'px';
  if (d.type === 'quickrupee-scroll-top') frame.scrollIntoView({ block: 'start' });
  if (d.type === 'quickrupee-complete') {
    loanData = d.data;
    interfaceDuration = Math.round((Date.now() - interfaceStartTime) / 1000);
    setTimeout(function () { showScreen('financial'); }, 250);
  }
});

// ---- Submission ----
function istTimestamp() {
  var ist = new Date(Date.now() + 5.5 * 3600 * 1000);
  function p(n) { return String(n).padStart(2, '0'); }
  return ist.getUTCFullYear() + '-' + p(ist.getUTCMonth() + 1) + '-' + p(ist.getUTCDate()) + ' ' +
         p(ist.getUTCHours()) + ':' + p(ist.getUTCMinutes()) + ':' + p(ist.getUTCSeconds()) + ' IST';
}
function buildPayload() {
  var flScore = 0, fl = {};
  FL_IDS.forEach(function (name, i) {
    var ans = getAnswer(name), ok = ans === FL_CORRECT[name] ? 'Yes' : 'No';
    if (ok === 'Yes') flScore++;
    fl['fl' + (i + 1) + 'Answer'] = ans;
    fl['fl' + (i + 1) + 'Correct'] = ok;
  });
  // Use the condition the participant actually saw (reported by the iframe).
  var actualCondition = loanData && loanData.condition ? loanData.condition : assignedCondition;
  var payload = {
    timestamp: istTimestamp(),
    participantId: participantId,
    participantNumber: participantNumber || 0,
    condition: actualCondition,
    age: getAnswer('q2'), education: getAnswer('q3'), employment: getAnswer('q4'),
    monthlyIncome: getAnswer('q5'), lendingExperience: getAnswer('q6'), lendingAppsCount: getAnswer('q7'),
    fl1Answer: fl.fl1Answer, fl1Correct: fl.fl1Correct,
    fl2Answer: fl.fl2Answer, fl2Correct: fl.fl2Correct,
    fl3Answer: fl.fl3Answer, fl3Correct: fl.fl3Correct,
    fl4Answer: fl.fl4Answer, fl4Correct: fl.fl4Correct,
    fl5Answer: fl.fl5Answer, fl5Correct: fl.fl5Correct,
    flScore: flScore,
    interfaceDuration: interfaceDuration,
    pressure1: getAnswer('p1'), pressure2: getAnswer('p2'), pressure3: getAnswer('p3'),
    pressure4: getAnswer('p4'), pressure5: getAnswer('p5'), pressure6: getAnswer('p6'),
    confidence1: getAnswer('d1'), confidence2: getAnswer('d2'), confidence3: getAnswer('d3'),
    confidence4: getAnswer('d4'), confidence5: getAnswer('d5'),
    detect1: getAnswer('x1'), detect2: getAnswer('x2'), detect3: getAnswer('x3'), detect4: getAnswer('x4')
  };
  if (loanData) {
    ['loanAmountRequested', 'overborrowingAmount', 'tenureSelected', 'insuranceAdded', 'emiAmount', 'totalRepayment',
     'decisionConfidence', 'recallAPR', 'recallAPRCorrect', 'recallFee', 'recallFeeCorrect', 'perceivedFairness']
      .forEach(function (k) { payload[k] = loanData[k]; });
  }
  payload.language = lang; // new field, sent last; language shown when the participant submitted
  return payload;
}

var payload = null;
function submitAll() {
  if (!validate(DP_IDS)) return;
  payload = buildPayload(); // built once, so a retry re-sends the identical row (same participantId)
  send();
}
function send() {
  showScreen('submitting');
  if (SHEET_URL === DEMO_URL) { console.log('Demo mode — payload:', payload); showScreen('thankyou'); return; }
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 20000);
  // The reply is read (text/plain keeps this a simple CORS request, no preflight). Only {"status":"success"}
  // counts; HTTP errors, HTML error pages and network failures show the retry screen. Retrying is safe:
  // the server ignores a second row with the same participantId.
  fetch(SHEET_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    signal: ctrl ? ctrl.signal : undefined
  }).then(readJson).then(function (data) {
    if (data.status !== 'success') throw new Error(data.message || 'Unexpected reply');
    clearTimeout(timer);
    showScreen('thankyou');
  }).catch(function (err) {
    clearTimeout(timer);
    console.warn('Submit failed:', err);
    showScreen('failed');
  });
}

// ---- Wiring ----
var ACTIONS = {
  consent: function () {
    if (!validate(['consent'])) return;
    if (checked('consent').value === 'no') { showScreen('declined'); return; }
    prepareInterface();
    showScreen('demographics');
  },
  toLoan: startInterface,
  retryFrame: retryFrame,
  toPressure: function () { if (validate(FL_IDS)) showScreen('pressure'); },
  toConfidence: function () { if (validate(PP_IDS)) showScreen('confidence'); },
  toDetection: function () { if (validate(DC_IDS)) showScreen('detection'); },
  submit: submitAll,
  retry: send
};
document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-lang')) setLang(b.getAttribute('data-lang'));
  else if (b.hasAttribute('data-act')) ACTIONS[b.getAttribute('data-act')]();
  else if (b.hasAttribute('data-go')) showScreen(b.getAttribute('data-go'));
});

applyI18n();
$('screen-consent').classList.add('active');
updateProgress();
})();
</script>
</body>
</html>
